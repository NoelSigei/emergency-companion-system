<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot.css') }}">
</head>
<body>

  <div class="login-card">

    <h2>Reset Password</h2>
    <p style="font-size: 14px; opacity: .8; margin-bottom: 20px;">
      Enter your email or phone to receive reset instructions
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('forgot_password') }}">

      <div class="input-group">
        <input type="text" name="email_or_phone" placeholder="Email or Phone" required>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">
        Send Reset Link
      </button>

    </form>

    <p style="margin-top:20px; font-size:13px;">
      Remembered your password?
      <a href="{{ url_for('login') }}" style="color:white;">Login</a>
    </p>

  </div>

</body>
</html>
